<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Área do Cliente — Falaw Advogados</title>
  <link rel="icon" type="image/png" href="../../../../assets/images/Falaw/falaw.com.br/wp-content/uploads/2024/06/fa-logo-branco-1.png" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data: https:; frame-ancestors 'none';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080D16;
      --bg-card:  #ffffff;
      --bg-input: #F5F5F7;
      --border:   rgba(0,0,0,0.08);
      --gold:     #7B1A2E;
      --gold-l:   #9B2238;
      --text:     #1A0A0D;
      --muted:    rgba(26,10,13,0.5);
      --accent:   #0D2B5E;
      --error:    #C0392B;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Animated background */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(13,43,94,0.35) 0%, transparent 65%);
      filter: blur(60px);
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 55%;
      height: 55%;
      background: radial-gradient(ellipse, rgba(184,149,42,0.12) 0%, transparent 65%);
      filter: blur(80px);
      animation: drift2 15s ease-in-out infinite alternate;
    }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(5%,8%); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-6%,-5%); } }

    /* Grid lines decoration */
    .grid-lines {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Card */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.35);
    }

    /* Logo */
    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
    }
    .login-logo img {
      height: 64px;
      width: auto;
      object-fit: contain;
      margin-bottom: 14px;
    }
    .login-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(123,26,46,0.08);
      border: 1px solid rgba(123,26,46,0.2);
      padding: 4px 12px;
      border-radius: 2px;
    }

    /* Title */
    .login-title {
      font-family: 'Sora', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 36px;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .form-input:focus {
      border-color: rgba(123,26,46,0.45);
    }
    .form-input::placeholder { color: rgba(232,235,240,0.25); }

    /* Error */
    .form-error {
      display: none;
      font-size: 12px;
      color: var(--error);
      margin-top: 4px;
      margin-bottom: 4px;
    }
    .form-error.show { display: block; }

    /* Button */
    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: var(--gold);
      border: none;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #ffffff;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn-login:hover { background: var(--gold-l); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Footer */
    .login-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 11px;
      color: rgba(232,235,240,0.2);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: .06em;
    }

    /* Divider */
    .login-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0 24px;
    }

    .login-info {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    .login-info a {
      color: var(--gold);
      text-decoration: none;
    }
    .btn-back {
      position: fixed;
      top: 20px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(232,235,240,0.5);
      text-decoration: none;
      z-index: 10;
      transition: background .2s, color .2s, border-color .2s;
      backdrop-filter: blur(8px);
    }
    .btn-back:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
      border-color: rgba(255,255,255,0.25);
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      body { overflow: auto; align-items: flex-start; padding-top: 64px; padding-bottom: 32px; }
      .login-wrap { padding: 12px; }
      .login-card { padding: 32px 24px 28px; }
      .login-logo img { height: 52px; }
      .login-logo { margin-bottom: 24px; }
      .login-title { font-size: 19px; }
      .login-subtitle { margin-bottom: 24px; }
      .form-input { padding: 13px 14px; min-height: 48px; font-size: 16px; /* prevents iOS zoom */ }
      .btn-login { padding: 15px; min-height: 48px; }
      .btn-back { top: 12px; left: 12px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../sb-config.js" onerror="void 0"></script>
</head>
<body>

<div class="bg-glow"></div>
<div class="grid-lines"></div>

<a href="../index.html" class="btn-back">← Voltar ao site</a>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-logo">
      <img loading="lazy" src="../../../../assets/images/Falaw/falaw.com.br/wp-content/uploads/2024/06/logo-falaw.png" alt="Falaw Advogados" />
      <span class="login-badge">Área do Cliente</span>
    </div>

    <h1 class="login-title">Acesso Restrito</h1>
    <p class="login-subtitle">Entre com suas credenciais para acessar seus relatórios</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input id="email" type="email" class="form-input" placeholder="seu@email.com.br" required autocomplete="email" maxlength="254" />
      </div>
      <div class="form-group">
        <label class="form-label" for="code">Código de Acesso</label>
        <input id="code" type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" maxlength="128" />
      </div>
      <div class="form-error" id="loginError">E-mail ou código de acesso inválidos.</div>
      <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
    </form>

    <hr class="login-divider" />

    <p class="login-info">
      Não possui acesso? Entre em contato com o escritório.<br/>
      <a href="../contato/index.html">Fale Conosco →</a>
    </p>

  </div>

  <div class="login-footer">
    © 2026 · Falaw Advogados · Acesso Seguro
  </div>
</div>

<script>
async function _sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const STORAGE_KEY = 'falaw_portal';
const _CLI_LOCK_KEY = 'falaw_login_lock';
const _CLI_MAX = 5;
const _CLI_LOCKOUT_MS = 15 * 60 * 1000;

function getClients() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

// Carrega clientes do Supabase e sincroniza o localStorage (Supabase é a fonte de verdade)
async function syncClientsFromGitHub() {
  const url = (window.SB_URL || '').trim();
  const key = (window.SB_KEY || '').trim();
  if (!url || !key || typeof supabase === 'undefined') return false;
  try {
    const sb = supabase.createClient(url, key);
    const { data, error } = await sb.from('clients').select('*');
    if (error) { console.warn('SB login sync:', error.message); return false; }
    if (!data || !data.length) return false;
    // Supabase é a fonte de verdade — preserva apenas fileData local (binários para download)
    const local = getClients();
    const clients = data.map(r => {
      const lc = local.find(l => l.id === r.id);
      const sbReports = r.reports || [];
      return {
        id: r.id,
        name: (r.name || '').trim() || (r.company || '').trim(),
        company: (r.company || '').trim(),
        email: r.email,
        code: r.code,
        createdAt: r.created_at,
        reports: sbReports.map(rep => {
          const lr = lc ? (lc.reports || []).find(l => l.id === rep.id) : null;
          return lr && lr.fileData ? { ...rep, fileData: lr.fileData } : rep;
        })
      };
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
    return true;
  } catch(e) { console.warn('SB login sync error:', e.message); return false; }
}

function _getCLILock() {
  try { return JSON.parse(sessionStorage.getItem(_CLI_LOCK_KEY)) || { attempts: 0, lockedUntil: 0 }; }
  catch { return { attempts: 0, lockedUntil: 0 }; }
}
function _setCLILock(d) { sessionStorage.setItem(_CLI_LOCK_KEY, JSON.stringify(d)); }

async function handleLogin(e) {
  e.preventDefault();
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  // Verificar bloqueio
  const lock = _getCLILock();
  if (lock.lockedUntil > Date.now()) {
    const mins = Math.ceil((lock.lockedUntil - Date.now()) / 60000);
    err.textContent = `Acesso bloqueado. Tente em ${mins} minuto(s).`;
    err.classList.add('show');
    return;
  }

  const email = document.getElementById('email').value.trim().toLowerCase();
  const code  = document.getElementById('code').value.trim();

  // Validação básica
  if (!email || !code) return;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    err.textContent = 'E-mail inválido.';
    err.classList.add('show');
    return;
  }

  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Verificando…';

  // Busca clientes diretamente do Supabase antes de autenticar
  const synced = await syncClientsFromGitHub();
  if (!synced) {
    // Supabase indisponível — tenta localStorage como cache
    const cached = getClients();
    if (!cached.length) {
      err.textContent = 'Não foi possível conectar ao servidor. Tente novamente.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }
  }

  const clients = getClients();

  // Login especial: escritório de audiências
  if (email === 'audiencias@falaw.com.br') {
    const HASH_ESC = window.SB_ESCRITORIO_PWD_HASH || 'b4eb89f661687c4f1896df9c720b43f6dc34f58b165d89898f9ca03db44fc717';
    const inputHash = await _sha256(code);
    if (inputHash === HASH_ESC) {
      _setCLILock({ attempts: 0, lockedUntil: 0 });
      sessionStorage.setItem('falaw_session', JSON.stringify({
        id: 'escritorio',
        name: 'Escritório',
        company: 'Falaw Advogados',
        email: 'audiencias@falaw.com.br',
        isEscritorio: true,
        loginAt: new Date().toISOString()
      }));
      window.location.href = 'dashboard.html';
      return;
    } else {
      const l = _getCLILock();
      l.attempts++;
      if (l.attempts >= _CLI_MAX) {
        l.lockedUntil = Date.now() + _CLI_LOCKOUT_MS;
        l.attempts = 0;
        err.textContent = 'Muitas tentativas. Acesso bloqueado por 15 minutos.';
      } else {
        err.textContent = `Senha inválida. ${_CLI_MAX - l.attempts} tentativa(s) restante(s).`;
      }
      _setCLILock(l);
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }
  }

  const client  = clients.find(c => c.email.toLowerCase() === email && c.code === code);

  // Login correspondente (advogado/preposto) via Supabase
  if (!client) {
    const sbUrl2 = (window.SB_URL || '').trim();
    const sbKey2 = (window.SB_KEY || '').trim();
    if (sbUrl2 && sbKey2 && typeof supabase !== 'undefined') {
      try {
        const sb2 = supabase.createClient(sbUrl2, sbKey2);
        const { data: corrData } = await sb2.from('correspondentes').select('*').eq('email', email).single();
        if (corrData && corrData.code === code) {
          _setCLILock({ attempts: 0, lockedUntil: 0 });
          sessionStorage.setItem('falaw_session', JSON.stringify({
            id: corrData.id, name: corrData.nome, company: corrData.nome,
            email: corrData.email, celular: corrData.celular||'', isCorrespondente: true,
            corrTipo: corrData.tipo, loginAt: new Date().toISOString()
          }));
          window.location.href = 'dashboard.html';
          return;
        }
      } catch(e) { console.warn('corr login:', e.message); }
    }
  }

  // Login correspondente (advogado/preposto) via Supabase
  if (!client) {
    const sbUrl2 = (window.SB_URL || '').trim();
    const sbKey2 = (window.SB_KEY || '').trim();
    if (sbUrl2 && sbKey2 && typeof supabase !== 'undefined') {
      try {
        const sb2 = supabase.createClient(sbUrl2, sbKey2);
        const { data: corrData } = await sb2.from('correspondentes').select('*').eq('email', email).single();
        if (corrData && corrData.code === code) {
          _setCLILock({ attempts: 0, lockedUntil: 0 });
          sessionStorage.setItem('falaw_session', JSON.stringify({
            id: corrData.id,
            name: corrData.nome,
            company: corrData.nome,
            email: corrData.email,
            celular: corrData.celular || '',
            isCorrespondente: true,
            corrTipo: corrData.tipo,
            loginAt: new Date().toISOString()
          }));
          window.location.href = 'dashboard.html';
          return;
        }
      } catch(e) { console.warn('corr login:', e.message); }
    }
  }

  if (client) {
    _setCLILock({ attempts: 0, lockedUntil: 0 });
    sessionStorage.setItem('falaw_session', JSON.stringify({
      id: client.id,
      name: client.name,
      company: client.company,
      email: client.email,
      loginAt: new Date().toISOString()
    }));
    // iFood client vai direto para o dashboard iFood
    const isIfood = (client.company || '').toLowerCase().includes('ifood');
    window.location.href = isIfood ? 'ifood.html' : 'dashboard.html';
  } else {
    const l = _getCLILock();
    l.attempts++;
    if (l.attempts >= _CLI_MAX) {
      l.lockedUntil = Date.now() + _CLI_LOCKOUT_MS;
      l.attempts = 0;
      err.textContent = 'Muitas tentativas. Acesso bloqueado por 15 minutos.';
    } else {
      err.textContent = `E-mail ou código inválidos. ${_CLI_MAX - l.attempts} tentativa(s) restante(s).`;
    }
    _setCLILock(l);
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

// Redirect if already logged in
(function() {
  const raw = sessionStorage.getItem('falaw_session');
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (s.isEscritorio || s.isCorrespondente) { window.location.href = 'dashboard.html'; return; }
    const isIfood = (s.company || '').toLowerCase().includes('ifood');
    window.location.href = isIfood ? 'ifood.html' : 'dashboard.html';
  } catch { window.location.href = 'dashboard.html'; }
})();
</script>
